<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Wishlist - Brand</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script>tailwind.config = { theme: { extend: { colors: { themeBg: '#E6D8C5', themeText: '#4A3B32', themeSub: '#7A6B63', themeBtn: '#4A3B32' } } } }</script>
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #E6D8C5; overflow-x: hidden; }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }
        .glass-panel { background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.3); }
        /* Smooth fade for removed items */
        .product-card { transition: opacity 0.4s ease, transform 0.4s ease; }
        .removing { opacity: 0; transform: scale(0.9); pointer-events: none; }
        .loader-overlay { position: fixed; inset: 0; background: #E6D8C5; z-index: 9999; display: flex; justify-content: center; align-items: center; transition: opacity 0.5s ease; }
        
        /* Mobile Menu Fix */
        #mobile-menu { 
            position: fixed;
            inset: 0;
            z-index: 9999 !important;
            background-color: #E6D8C5 !important;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: auto;
        }

        /* Fade Animation for Chat */
        .fade-in { animation: fadeIn 0.5s ease-in forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Pulse for Dot */
        @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); } 70% { box-shadow: 0 0 0 6px rgba(255, 255, 255, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); } }
        .dot-pulse { animation: pulse-ring 2s infinite; }
    </style>
</head>
<body class="bg-themeBg text-themeText min-h-screen flex flex-col">

    <div id="preloader" class="loader-overlay">
        <h1 class="text-4xl font-serif font-bold tracking-[0.5em] animate-pulse text-themeText">BRAND.</h1>
    </div>

    <nav id="app-navbar"></nav>

    <div class="container mx-auto px-6 py-12 flex-grow pt-32">
        <div class="text-center mb-12" data-aos="fade-down">
            <h1 class="text-4xl md:text-5xl font-serif font-bold mb-4">My Wishlist</h1>
            <p class="text-xs text-themeSub uppercase tracking-[0.2em]">Your curated collection of favorites</p>
        </div>

        <div id="loading" class="text-center py-20"><i class="fa-solid fa-circle-notch fa-spin text-3xl text-themeBtn"></i></div>
        
        <div id="empty-state" class="hidden text-center py-20 border border-dashed border-[#D6C8B5] rounded glass-panel max-w-2xl mx-auto">
            <div class="w-16 h-16 bg-[#4A3B32] rounded-full flex items-center justify-center mx-auto mb-6 text-[#E6D8C5] text-2xl shadow-lg"><i class="fa-solid fa-heart-crack"></i></div>
            <p class="text-xl font-serif font-bold mb-2">Your wishlist is empty</p>
            <p class="text-xs text-themeSub uppercase tracking-wider mb-8">Save items you love to view them here.</p>
            <a href="index.html" class="bg-themeBtn text-[#E6D8C5] px-8 py-3 rounded-sm text-xs font-bold uppercase tracking-widest hover:bg-[#3A2B22] transition shadow-lg">Explore Collection</a>
        </div>

        <div id="wishlist-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8"></div>
    </div>

    <footer id="app-footer"></footer>

    <div id="cart-sidebar" class="fixed inset-y-0 right-0 w-full md:w-[400px] bg-[#F5EBE0] shadow-2xl translate-x-full transition-transform duration-300 z-[60] flex flex-col border-l border-[#D6C8B5]">
        <div class="p-6 flex justify-between items-center border-b border-[#D6C8B5]"><h2 class="text-2xl font-serif font-bold">Shopping Bag</h2><button onclick="toggleCart()" class="text-2xl hover:text-red-500">&times;</button></div>
        <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-6"></div>
        <div class="p-6 border-t border-[#D6C8B5] bg-[#E6D8C5]"><div class="flex justify-between text-xl font-serif font-bold mb-6"><span>Subtotal</span><span id="cart-total">Rs. 0</span></div><button onclick="window.location.href='checkout.html'" class="w-full bg-themeBtn text-[#E6D8C5] py-4 font-bold uppercase tracking-widest hover:bg-[#3A2B22]">Checkout</button></div>
    </div>
    <div id="overlay" onclick="toggleCart()" class="fixed inset-0 bg-black/40 hidden z-50 backdrop-blur-sm"></div>

    <div id="chat-container" class="fixed bottom-8 right-8 z-50 hidden flex items-center gap-3 flex-row-reverse group">
        <a id="chat-btn-link" href="chat.html" onclick="window.hideChatDot()" class="relative bg-[#4A3B32] text-[#E6D8C5] w-12 h-12 rounded-full shadow-2xl hover:bg-[#3A2B22] transition-all duration-300 flex items-center justify-center border border-[#E6D8C5]">
            <i class="fa-solid fa-message text-xl"></i>
            <span id="chat-notification-dot" class="absolute top-0 right-0 w-3 h-3 bg-white rounded-full border border-[#4A3B32] hidden dot-pulse z-20"></span>
        </a>
        <div id="chat-tooltip" class="bg-white text-themeText px-3 py-1 rounded-sm shadow-xl border border-[#D6C8B5] text-[10px] font-bold uppercase tracking-widest whitespace-nowrap hidden relative transition-opacity duration-500 flex items-center">
            <span id="chat-tooltip-text">Support</span>
            <button onclick="window.closeChatTooltip()" class="ml-3 text-sm font-bold hover:text-red-500 focus:outline-none">&times;</button>
            <div class="absolute top-1/2 -right-1 w-2 h-2 bg-white transform -translate-y-1/2 rotate-45 border-r border-t border-[#D6C8B5]"></div>
        </div>
    </div>

    <script src="components.js"></script>
    <script type="module">
        import { auth, db, collection, query, where, getDocs, deleteDoc, doc, onAuthStateChanged, signOut, onSnapshot } from './firebase-config.js';

        const ADMIN_EMAIL = "mr.awaisaltaf@gmail.com";
        let currentUser = null;

        // 0. PRELOADER
        window.addEventListener('load', () => {
            const preloader = document.getElementById('preloader');
            preloader.style.opacity = '0';
            setTimeout(() => preloader.style.display = 'none', 500);
            setNavbarDark(); // FORCE DARK NAVBAR ON LOAD
        });

        // NAVBAR SCROLL LOGIC
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('navbar');
            if(!nav) return;
            
            if(window.scrollY > 50) {
                nav.classList.add('bg-[#E6D8C5]', 'shadow-sm', 'py-4');
                nav.classList.remove('py-6', 'border-transparent');
            } else {
                nav.classList.remove('bg-[#E6D8C5]', 'shadow-sm', 'py-4');
                nav.classList.add('py-6', 'border-transparent');
            }
        });

        // Function to force navbar text to dark brown
        function setNavbarDark() {
            const nav = document.getElementById('navbar');
            const logo = document.getElementById('nav-logo');
            const links = document.getElementById('nav-links');
            const icons = document.getElementById('nav-icons');
            const cartBadge = document.getElementById('cart-count');

            if(nav) {
                if(logo) logo.classList.replace('text-white', 'text-[#4A3B32]');
                if(links) links.classList.replace('text-white/90', 'text-[#4A3B32]');
                if(icons) icons.classList.replace('text-white', 'text-[#4A3B32]');
                if(cartBadge) {
                    cartBadge.classList.replace('text-[#E6D8C5]', 'text-white');
                    cartBadge.classList.replace('border-[#E6D8C5]', 'border-[#4A3B32]');
                }
            }
        }

        // --- CHAT HELPERS ---
        window.hideChatDot = () => document.getElementById('chat-notification-dot').classList.add('hidden');
        window.closeChatTooltip = () => {
            document.getElementById('chat-tooltip').classList.add('hidden');
            sessionStorage.setItem('chatPromptDismissed', 'true');
        };

        // 1. AUTH CHECK
        onAuthStateChanged(auth, user => {
            if (user) {
                currentUser = user;
                if(window.setupNavbarAuth) window.setupNavbarAuth(user, ADMIN_EMAIL);
                setNavbarDark(); // Ensure dark text after auth update
                loadWishlist(user.uid);

                // --- CHAT LOGIC ---
                const chatContainer = document.getElementById('chat-container');
                const chatTooltip = document.getElementById('chat-tooltip');
                const chatText = document.getElementById('chat-tooltip-text');
                const chatLink = document.getElementById('chat-btn-link');

                chatLink.href = "chat.html";
                chatText.innerText = "Need assistance?";
                chatContainer.classList.remove('hidden');

                if (sessionStorage.getItem('sessionChatStarted')) {
                    chatContainer.classList.remove('hidden');
                } else {
                    setTimeout(() => {
                        chatContainer.classList.remove('hidden');
                        chatContainer.classList.add('fade-in');
                        sessionStorage.setItem('sessionChatStarted', 'true');
                        if (!sessionStorage.getItem('chatPromptDismissed')) {
                            chatTooltip.classList.remove('hidden');
                            setTimeout(() => chatTooltip.classList.add('hidden'), 5000);
                        }
                    }, 5000); 
                }

                onSnapshot(doc(db, "chats", user.uid), (docSnap) => {
                    if(docSnap.exists() && docSnap.data().userUnread) {
                        document.getElementById('chat-notification-dot').classList.remove('hidden');
                        chatTooltip.classList.remove('hidden');
                        chatText.innerText = "New Message";
                    }
                });

            } else {
                window.location.href = "login.html";
            }
        });

        window.toggleUserMenu = () => { document.getElementById('user-dropdown')?.classList.toggle('hidden'); }
        window.toggleMobileMenu = () => document.getElementById('mobile-menu')?.classList.toggle('translate-x-full');
        window.handleLogout = async () => { if(confirm("Sign out?")) { await signOut(auth); localStorage.removeItem('myCart'); window.location.href = "login.html"; } }

        // 2. LOAD WISHLIST (OPTIMIZED RENDER)
        async function loadWishlist(uid) {
            const grid = document.getElementById('wishlist-grid');
            const loading = document.getElementById('loading');
            const empty = document.getElementById('empty-state');

            try {
                const q = query(collection(db, "wishlist"), where("userId", "==", uid));
                const snap = await getDocs(q);

                loading.classList.add('hidden');
                
                if (snap.empty) {
                    empty.classList.remove('hidden');
                    grid.innerHTML = "";
                    return;
                }

                empty.classList.add('hidden');
                
                // --- OPTIMIZATION: String Builder Pattern ---
                let wishlistHTML = "";
                const seenProducts = new Set();

                snap.forEach(d => {
                    const item = d.data();
                    const docId = d.id; 
                    
                    // Deduplication
                    if (seenProducts.has(item.productId)) return;
                    seenProducts.add(item.productId);
                    
                    wishlistHTML += `
                        <div id="card-${docId}" data-aos="fade-up" class="bg-white group relative shadow-xl hover:shadow-2xl transition-all duration-300 rounded-sm overflow-hidden border border-[#D6C8B5]/30 product-card">
                            <div class="relative h-[300px] overflow-hidden bg-gray-100">
                                <img src="${item.image}" class="w-full h-full object-cover transform group-hover:scale-105 transition duration-700" alt="${item.name}">
                                <div class="absolute inset-0 bg-black/10 group-hover:bg-black/0 transition"></div>
                                <button onclick="removeFromWishlist('${docId}')" class="absolute top-4 right-4 w-8 h-8 bg-white/90 rounded-full flex items-center justify-center text-red-500 hover:bg-red-500 hover:text-white transition shadow-md" title="Remove">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                            <div class="p-6 text-center">
                                <p class="text-[10px] uppercase font-bold text-[#7A6B63] tracking-widest mb-2">${item.category}</p>
                                <h3 class="text-xl font-serif font-bold text-themeText mb-2 line-clamp-1">${item.name}</h3>
                                <p class="text-themeBtn font-mono text-sm mb-6">Rs. ${item.price.toLocaleString()}</p>
                                <a href="product-details.html?id=${item.productId}" class="block w-full border border-[#4A3B32] text-[#4A3B32] py-3 text-xs font-bold uppercase tracking-widest hover:bg-[#4A3B32] hover:text-[#E6D8C5] transition rounded-sm">
                                    View Product
                                </a>
                            </div>
                        </div>
                    `;
                });

                // Update DOM Once
                grid.innerHTML = wishlistHTML;

            } catch (e) {
                console.error("Wishlist error:", e);
                loading.innerHTML = `<p class="text-red-500 font-bold">Error loading wishlist.</p>`;
            }
        }

        // 3. REMOVE ITEM
        window.removeFromWishlist = async (docId) => {
            const card = document.getElementById(`card-${docId}`);
            const btn = event.target.closest('button');
            
            if (card) card.classList.add('removing');
            if (btn) btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            
            try {
                await deleteDoc(doc(db, "wishlist", docId));
                
                setTimeout(() => {
                    if (card) card.remove();
                    const grid = document.getElementById('wishlist-grid');
                    if (grid.children.length === 0) {
                        document.getElementById('empty-state').classList.remove('hidden');
                    }
                }, 400);

            } catch (e) {
                console.error(e);
                alert("Could not remove item.");
                if (card) card.classList.remove('removing');
                if (btn) btn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
            }
        }

        // CART LOGIC
        const cart = JSON.parse(localStorage.getItem('myCart')) || [];
        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.reduce((a,b)=>a+b.qty,0);
            const con = document.getElementById('cart-items');
            con.innerHTML = cart.length ? '' : '<p class="text-center text-sm text-themeSub py-10">Your bag is empty.</p>';
            let t = 0;
            cart.forEach(i => {
                const price = i.discountPrice > 0 ? i.discountPrice : i.price; t += price * i.qty;
                con.innerHTML += `<div class="flex justify-between border-b border-[#D6C8B5] pb-2"><div><p class="font-bold text-sm">${i.name}</p><p class="text-xs text-gray-500">Size: ${i.selectedSize}</p><div class="flex items-center gap-2 border border-gray-300 w-fit px-2 mt-1 rounded-sm bg-white"><button onclick="changeQty('${i.id}-${i.selectedSize}', -1)" class="text-xs font-bold px-1 hover:text-red-500">-</button><span class="text-xs font-bold w-4 text-center">${i.qty}</span><button onclick="changeQty('${i.id}-${i.selectedSize}', 1)" class="text-xs font-bold px-1 hover:text-green-500">+</button></div></div><div class="text-right"><p class="font-bold text-sm">Rs. ${(price*i.qty).toLocaleString()}</p><button onclick="removeItem('${i.id}-${i.selectedSize}')" class="text-xs text-red-500 hover:underline">Remove</button></div></div>`;
            });
            document.getElementById('cart-total').innerText = 'Rs. ' + t.toLocaleString();
        }
        window.changeQty = (id, c) => { const i = cart.find(x => `${x.id}-${x.selectedSize}` === id); if(i){ i.qty+=c; if(i.qty<1) i.qty=1; localStorage.setItem('myCart', JSON.stringify(cart)); updateCartUI(); } }
        window.toggleCart = () => { const s = document.getElementById('cart-sidebar'), o = document.getElementById('overlay'); if(s.classList.contains('translate-x-full')) { s.classList.remove('translate-x-full'); o.classList.remove('hidden'); updateCartUI(); } else { s.classList.add('translate-x-full'); o.classList.add('hidden'); } }
        window.removeItem = (id) => { const x = cart.findIndex(i => `${i.id}-${i.selectedSize}` === id); if(x>-1){ cart.splice(x,1); localStorage.setItem('myCart', JSON.stringify(cart)); updateCartUI(); } }
        window.checkout = () => { if(!cart.length) return alert("Your bag is empty."); window.location.href="checkout.html"; }
        updateCartUI();
    </script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>AOS.init({ duration: 800, once: true });</script>
</body>
</html>
