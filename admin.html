<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Brand</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script>tailwind.config = { theme: { extend: { colors: { themeBg: '#E6D8C5', themeText: '#4A3B32', themeSub: '#7A6B63', themeBtn: '#4A3B32' } } } }</script>
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f3f4f6; }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }
        .sidebar-link { transition: all 0.3s; opacity: 0.8; }
        .sidebar-link:hover { opacity: 1; background-color: rgba(255,255,255,0.1); }

        /* Custom Dropdown Arrow */
        .custom-select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
            -webkit-appearance: none;
            appearance: none;
        }

        /* Tags/Chips Style */
        .tag-chip {
            display: inline-flex;
            align-items: center;
            background: #F3F4F6;
            border: 1px solid #E5E7EB;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #374151;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .tag-chip button { margin-left: 0.5rem; color: #9CA3AF; transition: color 0.2s; }
        .tag-chip button:hover { color: #EF4444; }

        /* Mobile Responsive Table */
        @media (max-width: 768px) {
            .admin-table-header { display: none; }
            .admin-row { display: flex; flex-direction: column; padding: 1rem; margin-bottom: 1rem; background: white; border-radius: 0.5rem; border: 1px solid #e5e7eb; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }
            .admin-cell { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; border: none; width: 100%; text-align: right; }
            .admin-cell::before { content: attr(data-label); font-weight: 700; text-transform: uppercase; font-size: 0.65rem; color: #9ca3af; text-align: left; }
            .admin-cell:first-child { border-bottom: 1px solid #f3f4f6; margin-bottom: 0.5rem; padding-bottom: 1rem; flex-direction: row; justify-content: flex-start; gap: 1rem; text-align: left; }
            .admin-cell:first-child::before { display: none; } 
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col">

    <header class="bg-[#1a1a1a] text-white py-4 px-4 md:px-8 shadow-lg flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <h1 class="text-xl md:text-2xl font-bold tracking-widest text-white">BRAND <span class="text-gray-500 text-[10px] align-top bg-gray-800 px-2 py-0.5 rounded ml-1">ADMIN</span></h1>
        </div>
        <div class="flex items-center gap-3 md:gap-4 text-xs font-bold uppercase tracking-wider">
            <span id="admin-user-display" class="text-gray-500 normal-case hidden lg:inline">...</span>
            
            <a href="admin-chat.html" class="sidebar-link px-3 py-2 rounded flex items-center gap-2 relative bg-gray-800/50 border border-gray-700 hover:bg-gray-700 text-white transition">
                <i class="fa-solid fa-comments"></i> <span class="hidden md:inline">Inbox</span>
                <span id="badge-chat" class="hidden w-2 h-2 bg-blue-500 rounded-full absolute top-1 right-1 animate-pulse border border-[#1a1a1a]"></span>
            </a>

            <a href="admin-orders.html" class="sidebar-link px-3 py-2 rounded flex items-center gap-2 relative bg-gray-800/50 border border-gray-700">
                <i class="fa-solid fa-box-open"></i> <span class="hidden md:inline">Orders</span>
                <span id="badge-orders" class="hidden w-2 h-2 bg-red-500 rounded-full absolute top-1 right-1 animate-pulse border border-[#1a1a1a]"></span>
            </a>
            
            <button onclick="handleLogout()" class="text-red-400 hover:text-red-300 transition flex items-center gap-2 ml-2">
                <i class="fa-solid fa-right-from-bracket text-lg"></i> <span class="hidden md:inline">Logout</span>
            </button>
        </div>
    </header>

    <div class="container mx-auto px-4 md:px-6 py-10 flex-grow">
        
        <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-10 gap-6">
            <div>
                <h2 class="text-3xl font-serif font-bold text-[#4A3B32]">Product Inventory</h2>
                <p class="text-gray-500 text-sm mt-1">Catalog and stock management</p>
            </div>
            <button onclick="openModal()" class="w-full md:w-auto bg-[#4A3B32] text-[#E6D8C5] px-8 py-4 md:py-3 font-bold uppercase tracking-widest hover:bg-[#3A2B22] transition shadow-xl text-xs rounded-sm flex items-center justify-center gap-2">
                <i class="fa-solid fa-plus"></i> Add New Product
            </button>
        </div>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6 mb-10">
            <div class="bg-white p-5 rounded-lg shadow-sm border-l-4 border-blue-500">
                <p class="text-[10px] font-bold uppercase text-gray-400 tracking-widest">Total</p>
                <p id="stat-total" class="text-2xl font-bold text-gray-800 mt-1">0</p>
            </div>
            <div class="bg-white p-5 rounded-lg shadow-sm border-l-4 border-[#4A3B32]">
                <p class="text-[10px] font-bold uppercase text-gray-400 tracking-widest">Men</p>
                <p id="stat-men" class="text-2xl font-bold text-gray-800 mt-1">0</p>
            </div>
            <div class="bg-white p-5 rounded-lg shadow-sm border-l-4 border-pink-500">
                <p class="text-[10px] font-bold uppercase text-gray-400 tracking-widest">Women</p>
                <p id="stat-women" class="text-2xl font-bold text-gray-800 mt-1">0</p>
            </div>
            <div class="bg-white p-5 rounded-lg shadow-sm border-l-4 border-yellow-500">
                <p class="text-[10px] font-bold uppercase text-gray-400 tracking-widest">Kids</p>
                <p id="stat-kids" class="text-2xl font-bold text-gray-800 mt-1">0</p>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow-md border border-gray-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="admin-table-header bg-gray-50 text-xs uppercase font-bold text-gray-500 tracking-wider">
                        <tr>
                            <th class="p-5 border-b border-gray-200">Product Details</th>
                            <th class="p-5 border-b border-gray-200">Category</th>
                            <th class="p-5 border-b border-gray-200">Stock</th>
                            <th class="p-5 border-b border-gray-200">Price</th>
                            <th class="p-5 border-b border-gray-200">Status</th>
                            <th class="p-5 border-b border-gray-200 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="product-table-body" class="text-sm divide-y divide-gray-100">
                        <tr><td colspan="6" class="p-10 text-center text-gray-400 animate-pulse">Synchronizing inventory...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="product-modal" class="fixed inset-0 bg-black/60 hidden z-[70] flex items-center justify-center backdrop-blur-sm px-2 md:px-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white w-full max-w-4xl rounded-lg shadow-2xl overflow-hidden transform scale-95 transition-transform duration-300 flex flex-col max-h-[95vh]">
            
            <div class="bg-[#4A3B32] text-[#E6D8C5] px-6 md:px-8 py-5 flex justify-between items-center">
                <h3 id="modal-title" class="font-bold uppercase tracking-widest text-base md:text-lg">Product Manager</h3>
                <button onclick="closeModal()" class="hover:text-white transition p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <div class="p-6 md:p-8 overflow-y-auto flex-grow bg-gray-50">
                <form id="productForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <input type="hidden" id="p-id"> 
                    
                    <div class="md:col-span-2">
                        <label class="block text-[10px] font-bold uppercase mb-2 tracking-widest text-gray-500">Product Name</label>
                        <input type="text" id="p-name" class="w-full p-3 bg-white border border-gray-300 rounded focus:border-[#4A3B32] outline-none transition text-sm font-medium" placeholder="e.g. Classic Leather Jacket" required>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold uppercase mb-2 tracking-widest text-gray-500">Category</label>
                        <select id="p-category" class="w-full p-3 bg-white border border-gray-300 rounded focus:border-[#4A3B32] outline-none transition text-sm cursor-pointer custom-select">
                            <option value="Men">Men</option>
                            <option value="Women">Women</option>
                            <option value="Kids">Kids</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-[10px] font-bold uppercase mb-2 tracking-widest text-gray-500">Sub-Category</label>
                        <select id="p-subcategory" class="w-full p-3 bg-white border border-gray-300 rounded focus:border-[#4A3B32] outline-none transition text-sm cursor-pointer custom-select">
                            <option value="Cloths">Clothing</option>
                            <option value="Shoes">Shoes</option>
                            <option value="Accessories">Accessories</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-4 md:col-span-1">
                        <div>
                            <label class="block text-[10px] font-bold uppercase mb-2 tracking-widest text-gray-500">Price (Rs)</label>
                            <input type="number" id="p-price" class="w-full p-3 bg-white border border-gray-300 rounded focus:border-[#4A3B32] outline-none transition text-sm" placeholder="0.00" required>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold uppercase mb-2 tracking-widest text-gray-500">Sale (Rs)</label>
                            <input type="number" id="p-discount" class="w-full p-3 bg-white border border-gray-300 rounded focus:border-[#4A3B32] outline-none transition text-sm" placeholder="0.00">
                        </div>
                    </div>

                    <div class="md:col-span-1">
                        <label class="block text-[10px] font-bold uppercase mb-2 tracking-widest text-gray-500">Stock Level</label>
                        <input type="number" id="p-stock" class="w-full p-3 bg-white border border-gray-300 rounded focus:border-[#4A3B32] outline-none transition text-sm" placeholder="Qty" required>
                    </div>

                    <div class="md:col-span-2">
                        <label class="block text-[10px] font-bold uppercase mb-2 tracking-widest text-gray-500">Short Description</label>
                        <textarea id="p-desc" rows="3" class="w-full p-3 bg-white border border-gray-300 rounded focus:border-[#4A3B32] outline-none transition text-sm" placeholder="Enter product details..."></textarea>
                    </div>

                    <div class="md:col-span-1">
                        <label class="block text-[10px] font-bold uppercase mb-2 tracking-widest text-gray-500">Colors</label>
                        <div class="flex gap-2 mb-2">
                            <input type="text" id="color-input" class="flex-grow p-2 bg-white border border-gray-300 rounded text-sm" placeholder="e.g. Navy Blue">
                            <button type="button" onclick="addColor()" class="bg-gray-200 px-4 rounded hover:bg-gray-300 text-xs font-bold uppercase">Add</button>
                        </div>
                        <div id="colors-container" class="min-h-[40px] p-2 border border-gray-200 rounded bg-white flex flex-wrap"></div>
                    </div>

                    <div class="md:col-span-1">
                        <label class="block text-[10px] font-bold uppercase mb-2 tracking-widest text-gray-500">Sizes</label>
                        <div class="flex gap-2 mb-2">
                            <input type="text" id="size-input" class="flex-grow p-2 bg-white border border-gray-300 rounded text-sm" placeholder="e.g. XL or 42">
                            <button type="button" onclick="addSize()" class="bg-gray-200 px-4 rounded hover:bg-gray-300 text-xs font-bold uppercase">Add</button>
                        </div>
                        <div id="sizes-container" class="min-h-[40px] p-2 border border-gray-200 rounded bg-white flex flex-wrap"></div>
                    </div>

                    <div class="md:col-span-2">
                        <label class="block text-[10px] font-bold uppercase mb-2 tracking-widest text-gray-500">Media Gallery (Images/Videos)</label>
                        <div class="flex gap-2 mb-2">
                            <input type="text" id="media-input" class="flex-grow p-2 bg-white border border-gray-300 rounded text-sm" placeholder="https://...">
                            <button type="button" onclick="addMedia()" class="bg-gray-200 px-4 rounded hover:bg-gray-300 text-xs font-bold uppercase">Attach</button>
                        </div>
                        <div id="media-container" class="space-y-2 max-h-32 overflow-y-auto p-2 border border-gray-200 rounded bg-white">
                            </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4 md:col-span-2">
                        <div>
                            <label class="block text-[10px] font-bold uppercase mb-2 tracking-widest text-gray-500">Listing Priority</label>
                            <input type="number" id="p-priority" class="w-full p-3 bg-white border border-gray-300 rounded focus:border-[#4A3B32] outline-none transition text-sm" placeholder="50">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold uppercase mb-2 tracking-widest text-gray-500">Visibility</label>
                            <select id="p-visible" class="w-full p-3 bg-white border border-gray-300 rounded focus:border-[#4A3B32] outline-none transition text-sm cursor-pointer custom-select">
                                <option value="true">Visible</option>
                                <option value="false">Hidden</option>
                            </select>
                        </div>
                    </div>
                </form>

                <div class="mt-8 pt-6 border-t border-gray-200">
                    <table class="w-full text-[10px] text-gray-500 uppercase tracking-widest">
                        <tr>
                            <td class="py-2 font-bold">Standard Handling</td>
                            <td class="py-2 text-right">Gloves Required</td>
                        </tr>
                        <tr>
                            <td class="py-2 font-bold">Ambient Condition</td>
                            <td class="py-2 text-right text-blue-700 font-bold">Optimal: 18°C - 24°C</td>
                        </tr>
                    </table>
                </div>
            </div>

            <div class="bg-gray-100 px-6 md:px-8 py-5 flex flex-col md:flex-row justify-end gap-3 border-t border-gray-200">
                <button onclick="closeModal()" class="order-2 md:order-1 px-6 py-3 text-xs font-bold uppercase tracking-widest text-gray-500 hover:text-gray-800 transition">Cancel</button>
                <button onclick="saveProduct()" id="btn-save" class="order-1 md:order-2 bg-[#4A3B32] text-[#E6D8C5] px-8 py-3 font-bold uppercase tracking-widest hover:bg-[#3A2B22] transition shadow-lg text-xs rounded-sm">Save Product</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, collection, getDocs, addDoc, doc, updateDoc, deleteDoc, auth, onAuthStateChanged, signOut, query, where, onSnapshot } from './firebase-config.js';

        const ADMIN_EMAIL = "mr.awaisaltaf@gmail.com"; 
        let allProducts = [];
        
        // Temp arrays for modal
        let tempColors = [];
        let tempSizes = [];
        let tempMedia = [];

        onAuthStateChanged(auth, (user) => {
            if (!user || user.email !== ADMIN_EMAIL) {
                window.location.href = "login.html";
            } else {
                document.getElementById('admin-user-display').innerText = user.email;
                loadProducts();
                setupNotifications(); // Initialize Real-time Badges
            }
        });

        // --- DYNAMIC BADGE LOGIC ---
        function setupNotifications() {
            // 1. Unread Messages Listener
            const chatQ = query(collection(db, "chats"), where("unread", "==", true));
            onSnapshot(chatQ, (snap) => {
                const badge = document.getElementById('badge-chat');
                if(!snap.empty) badge.classList.remove('hidden');
                else badge.classList.add('hidden');
            });

            // 2. Pending Orders Listener
            const orderQ = query(collection(db, "orders"), where("status", "==", "Processing"));
            onSnapshot(orderQ, (snap) => {
                const badge = document.getElementById('badge-orders');
                if(!snap.empty) badge.classList.remove('hidden');
                else badge.classList.add('hidden');
            });
        }

        window.handleLogout = async () => {
            if(confirm("Exit Admin Dashboard?")) {
                await signOut(auth);
                window.location.href = "login.html";
            }
        }

        async function loadProducts() {
            const tbody = document.getElementById('product-table-body');
            try {
                const snap = await getDocs(collection(db, "products"));
                allProducts = [];
                let counts = { Men: 0, Women: 0, Kids: 0 };

                snap.forEach(d => {
                    const data = d.data();
                    allProducts.push({ id: d.id, ...data });
                    if(counts[data.category] !== undefined) counts[data.category]++;
                });

                document.getElementById('stat-total').innerText = allProducts.length;
                document.getElementById('stat-men').innerText = counts.Men;
                document.getElementById('stat-women').innerText = counts.Women;
                document.getElementById('stat-kids').innerText = counts.Kids;

                renderTable();
            } catch (error) {
                console.error(error);
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-red-500 font-bold">Access Error: Check Database Connection.</td></tr>`;
            }
        }

        function renderTable() {
            const tbody = document.getElementById('product-table-body');
            tbody.innerHTML = '';
            allProducts.sort((a,b) => (b.priority || 0) - (a.priority || 0));

            if(allProducts.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-gray-400 italic">No products currently listed.</td></tr>`;
                return;
            }

            allProducts.forEach(p => {
                const priceDisplay = p.discountPrice > 0 
                    ? `<span class="text-red-600 font-bold mr-1">Rs. ${p.discountPrice.toLocaleString()}</span> <span class="line-through text-gray-400 text-xs">${p.price.toLocaleString()}</span>` 
                    : `Rs. ${p.price.toLocaleString()}`;

                const visibilityBadge = p.isVisible !== false 
                    ? `<span class="bg-green-100 text-green-700 px-2 py-1 rounded text-[10px] uppercase font-bold tracking-wide border border-green-200">Active</span>`
                    : `<span class="bg-gray-100 text-gray-500 px-2 py-1 rounded text-[10px] uppercase font-bold tracking-wide border border-gray-200">Hidden</span>`;

                const stock = p.stock !== undefined ? p.stock : 0;
                const stockBadge = stock < 5 
                    ? `<span class="bg-red-100 text-red-700 px-2 py-1 rounded text-[10px] font-bold border border-red-200">Low: ${stock}</span>`
                    : `<span class="text-gray-600 font-bold">${stock}</span>`;

                const mainImage = (p.media && p.media.length > 0) ? p.media[0].url : (p.image || '');

                tbody.innerHTML += `
                    <tr class="admin-row hover:bg-gray-50 transition group bg-white">
                        <td class="admin-cell p-5 flex items-center gap-4" data-label="Product">
                            <div class="w-12 h-12 rounded bg-gray-100 flex-shrink-0 overflow-hidden border border-gray-200">
                                <img src="${mainImage}" class="w-full h-full object-cover">
                            </div>
                            <div class="text-left">
                                <p class="font-bold text-gray-800 line-clamp-1">${p.name}</p>
                                <span class="text-[10px] text-gray-400 font-mono tracking-wide">${p.serialNumber || 'NO-REF'}</span>
                            </div>
                        </td>
                        <td class="admin-cell p-5 text-gray-600" data-label="Category">
                            <div class="flex flex-col md:items-start items-end">
                                <span class="text-xs font-bold uppercase text-[#4A3B32]">${p.category}</span>
                                <span class="text-[10px] text-gray-400">${p.subcategory}</span>
                            </div>
                        </td>
                        <td class="admin-cell p-5" data-label="Stock">${stockBadge}</td>
                        <td class="admin-cell p-5 font-mono text-sm text-gray-700" data-label="Price">${priceDisplay}</td>
                        <td class="admin-cell p-5" data-label="Status">${visibilityBadge}</td>
                        <td class="admin-cell p-5 text-right" data-label="Actions">
                            <div class="flex justify-end gap-2">
                                <button onclick="editProduct('${p.id}')" class="bg-blue-50 text-blue-600 border border-blue-100 p-2 rounded transition hover:bg-blue-600 hover:text-white"><i class="fa-solid fa-pen-to-square"></i></button>
                                <button onclick="deleteProduct('${p.id}')" class="bg-red-50 text-red-500 border border-red-100 p-2 rounded transition hover:bg-red-500 hover:text-white"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }

        // --- MODAL & LOGIC HANDLERS ---

        window.openModal = () => {
            document.getElementById('productForm').reset();
            document.getElementById('p-id').value = '';
            document.getElementById('modal-title').innerText = "Create New Product";
            
            // Clear Tags
            tempColors = []; tempSizes = []; tempMedia = [];
            renderTags('colors'); renderTags('sizes'); renderMediaList();

            const modal = document.getElementById('product-modal');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); modal.querySelector('div').classList.add('scale-100'); }, 10);
        }

        window.closeModal = () => {
            const modal = document.getElementById('product-modal');
            modal.classList.add('opacity-0');
            modal.querySelector('div').classList.remove('scale-100');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        // --- TAGS SYSTEM (COLORS & SIZES) ---
        window.addColor = () => {
            const val = document.getElementById('color-input').value.trim();
            if(val && !tempColors.includes(val)) { tempColors.push(val); renderTags('colors'); }
            document.getElementById('color-input').value = '';
        }
        window.addSize = () => {
            const val = document.getElementById('size-input').value.trim();
            if(val && !tempSizes.includes(val)) { tempSizes.push(val); renderTags('sizes'); }
            document.getElementById('size-input').value = '';
        }
        window.removeTag = (type, index) => {
            if(type === 'colors') tempColors.splice(index, 1);
            else tempSizes.splice(index, 1);
            renderTags(type);
        }
        function renderTags(type) {
            const container = document.getElementById(`${type}-container`);
            const arr = type === 'colors' ? tempColors : tempSizes;
            container.innerHTML = arr.map((item, i) => `
                <div class="tag-chip">
                    ${item} <button type="button" onclick="removeTag('${type}', ${i})">&times;</button>
                </div>
            `).join('');
        }

        // --- MEDIA SYSTEM ---
        window.addMedia = () => {
            const val = document.getElementById('media-input').value.trim();
            if(val) {
                // Determine Type (Video if mp4, else Image)
                const type = val.endsWith('.mp4') ? 'video' : 'image';
                tempMedia.push({ type, url: val });
                renderMediaList();
            }
            document.getElementById('media-input').value = '';
        }
        window.removeMedia = (index) => {
            tempMedia.splice(index, 1);
            renderMediaList();
        }
        function renderMediaList() {
            const container = document.getElementById('media-container');
            container.innerHTML = tempMedia.map((m, i) => `
                <div class="flex items-center justify-between bg-gray-50 p-2 rounded border border-gray-200 text-xs">
                    <div class="flex items-center gap-2 truncate">
                        <i class="fa-solid ${m.type === 'video' ? 'fa-video' : 'fa-image'} text-gray-400"></i>
                        <span class="truncate text-gray-600">${m.url}</span>
                    </div>
                    <button type="button" onclick="removeMedia(${i})" class="text-red-500 hover:text-red-700"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
        }

        // --- SAVE FUNCTION ---
        window.saveProduct = async () => {
            const btn = document.getElementById('btn-save');
            const id = document.getElementById('p-id').value;

            const data = {
                name: document.getElementById('p-name').value,
                price: Number(document.getElementById('p-price').value),
                discountPrice: Number(document.getElementById('p-discount').value || 0),
                stock: Number(document.getElementById('p-stock').value || 0),
                category: document.getElementById('p-category').value,
                subcategory: document.getElementById('p-subcategory').value,
                description: document.getElementById('p-desc').value,
                colors: tempColors,
                sizes: tempSizes, // Added support for explicit sizes
                media: tempMedia,
                image: tempMedia.length > 0 ? tempMedia[0].url : "", // Backwards compatibility for card thumbnail
                priority: Number(document.getElementById('p-priority').value || 50),
                isVisible: document.getElementById('p-visible').value === 'true'
            };

            if(!data.name || !data.price || data.media.length === 0) return alert("Please fill Name, Price, and add at least 1 Media item.");

            btn.innerText = "Processing...";
            btn.disabled = true;

            try {
                if(id) {
                    await updateDoc(doc(db, "products", id), data);
                } else {
                    const serial = 'BRD-' + Math.floor(Math.random() * 900000 + 100000);
                    await addDoc(collection(db, "products"), { ...data, serialNumber: serial, createdAt: new Date() });
                }
                closeModal();
                loadProducts(); 
            } catch(e) {
                alert("Database Error: " + e.message);
            } finally {
                btn.innerText = "Save Product";
                btn.disabled = false;
            }
        }

        window.editProduct = (id) => {
            const p = allProducts.find(x => x.id === id);
            if(!p) return;
            
            document.getElementById('p-id').value = p.id;
            document.getElementById('p-name').value = p.name;
            document.getElementById('p-price').value = p.price;
            document.getElementById('p-discount').value = p.discountPrice || 0;
            document.getElementById('p-stock').value = p.stock || 0;
            document.getElementById('p-category').value = p.category;
            document.getElementById('p-subcategory').value = p.subcategory;
            document.getElementById('p-desc').value = p.description || "";
            document.getElementById('p-priority').value = p.priority || 50;
            document.getElementById('p-visible').value = String(p.isVisible !== false);
            
            // Populate Tags
            tempColors = p.colors || [];
            tempSizes = p.sizes || [];
            
            // Handle Media Migration (If old format used 'image' string only)
            if(p.media && p.media.length > 0) {
                tempMedia = p.media;
            } else if (p.image) {
                tempMedia = [{ type: 'image', url: p.image }];
            } else {
                tempMedia = [];
            }

            renderTags('colors');
            renderTags('sizes');
            renderMediaList();

            document.getElementById('modal-title').innerText = "Update Inventory";
            const modal = document.getElementById('product-modal');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); modal.querySelector('div').classList.add('scale-100'); }, 10);
        }

        window.deleteProduct = async (id) => {
            if(confirm("Delete this product permanently?")) {
                try {
                    await deleteDoc(doc(db, "products", id));
                    loadProducts();
                } catch(e) { alert(e.message); }
            }
        }
    </script>
</body>
</html>
